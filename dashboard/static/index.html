<!doctype html><html><head><meta charset="utf-8"><title>SYNQ | SIH26123</title><style>
:root{color-scheme:dark;--bg:#09111f;--panel:#111d31;--line:#263956;--accent:#42d3a2;--warn:#ffb74d;--red:#ff5d6c}*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:var(--bg);color:#dce8fa}header{height:58px;display:flex;gap:26px;align-items:center;padding:0 20px;background:#0d1728;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0;color:var(--accent)}.bad{color:var(--red);font-weight:bold}.layout{display:grid;grid-template-columns:minmax(520px,1fr) 330px;gap:12px;padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}.map{display:grid;gap:1px;background:#050a12;padding:5px;aspect-ratio:1.6}.cell{min-width:0;min-height:0;background:#13233c;position:relative}.wall{background:#3b4b60}.dyn{background:#71404a}.zone{outline:1px solid #2e7a90}.path{background:#264f72}.intent{box-shadow:inset 0 0 0 2px #e7c65d}.robot{border-radius:50%;margin:16%;display:grid;place-items:center;font-size:9px;font-weight:bold;color:white;background:#4885e9}.offline{background:#777;text-decoration:line-through}.goal:after{content:'◇';position:absolute;color:#42d3a2;font-size:16px;inset:0;text-align:center}.controls button{margin:3px;padding:7px;background:#1c3151;border:1px solid #365784;color:#dce8fa;border-radius:5px;cursor:pointer}.cards{display:grid;gap:7px}.card{padding:9px;border-left:4px solid #4885e9;background:#0d1728}.offline-card{border-color:#777;opacity:.7}.small{color:#9eb0c9;font-size:12px}.metric{display:inline-block;width:48%;padding:5px}.events{height:180px;overflow:auto;font-family:ui-monospace;font-size:12px}.event{padding:3px;border-bottom:1px solid #1d2e48}.task-form input{width:70px;margin:3px}.task-form button{padding:5px}.task{border-top:1px solid var(--line);padding:6px 0}@media(max-width:900px){.layout{grid-template-columns:1fr}.map{min-height:350px}}
</style></head><body><header><h1>SYNQ / SIH26123</h1><span id="scenario">Scenario: basic</span><span id="time">t=0</span><span id="collision" class="bad">COLLISIONS: 0</span></header><main class="layout"><section class="panel"><div class="controls" id="controls"></div><div id="map" class="map"></div></section><aside class="panel"><h3>Robots</h3><div id="robots" class="cards"></div><h3>Tasks</h3><div id="tasks"></div><form class="task-form" id="task-form">Destination <input id="x" type="number" min="0" value="35">,<input id="y" type="number" min="0" value="2"><button>Create task</button><div class="small">Tasks use the existing destination-only lifecycle.</div></form><h3>Metrics</h3><div id="metrics"></div></aside><section class="panel" style="grid-column:1/-1"><h3>Event stream</h3><div id="events" class="events"></div></section></main><script>
const controls=['basic','intersection','corridor','deadlock','robot_failure','offline_robot_blockage'];const ctl=document.querySelector('#controls');controls.forEach(n=>{let b=document.createElement('button');b.textContent=n.replaceAll('_',' ');b.onclick=()=>fetch('/api/scenarios/'+n,{method:'POST'});ctl.append(b)});let reset=document.createElement('button');reset.textContent='Reset';reset.onclick=()=>fetch('/api/reset',{method:'POST'});ctl.append(reset);
function cellKey(c){return c.x+','+c.y}function render(s){scenario.textContent='Scenario: '+s.scenario;time.textContent='t='+s.time;collision.textContent='COLLISIONS: '+s.metrics.collisions;let g=s.grid,map=document.querySelector('#map');map.style.gridTemplateColumns=`repeat(${g.width},1fr)`;map.innerHTML='';let walls=new Set(g.obstacles.map(cellKey)),dyn=new Set(g.dynamic_obstacles.map(cellKey)),paths=new Set(s.robots.flatMap(r=>r.planned_path.map(cellKey))),intents=new Set(s.robots.flatMap(r=>r.intent.map(cellKey))),goals=new Set(s.robots.filter(r=>r.goal).map(r=>cellKey(r.goal))),bots=new Map(s.robots.map(r=>[cellKey(r.pose),r]));for(let y=0;y<g.height;y++)for(let x=0;x<g.width;x++){let k=x+','+y,d=document.createElement('div');d.className='cell '+(walls.has(k)?'wall ':'')+(dyn.has(k)?'dyn ':'')+(paths.has(k)?'path ':'')+(intents.has(k)?'intent ':'')+(goals.has(k)?'goal ':'');let r=bots.get(k);if(r){let e=document.createElement('div');e.className='robot '+(!r.online?'offline':'');e.textContent=r.robot_id;d.append(e)}map.append(d)}
robots.innerHTML=s.robots.map(r=>`<div class="card ${!r.online?'offline-card':''}"><b>${r.robot_id}</b> ${r.online?'ONLINE':'OFFLINE'}<br><span class="small">${r.state} · (${r.pose.x},${r.pose.y}) → ${r.goal?`(${r.goal.x},${r.goal.y})`:'—'}<br>Task: ${r.task_id||'—'} · ${r.priority} · Battery ${r.battery}%<br>Waiting ${r.waiting_time} · Replans ${r.replan_count}</span></div>`).join('');tasks.innerHTML=s.tasks.map(t=>`<div class="task"><b>${t.task_id}</b> ${t.status}<br>${t.assigned_robot_id||'unassigned'} → (${t.destination.x},${t.destination.y})</div>`).join('')||'<span class="small">No dispatched tasks</span>';metrics.innerHTML=Object.entries(s.metrics).map(([k,v])=>`<span class="metric">${k.replaceAll('_',' ')}: <b>${v}</b></span>`).join('');events.innerHTML=s.events.slice().reverse().map(e=>`<div class="event">${e.timestamp??0} · <b>${e.type}</b> · ${Object.entries(e).filter(([k])=>!['type','timestamp'].includes(k)).map(([k,v])=>k+'='+JSON.stringify(v)).join(' ')}</div>`).join('')}
let ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>render(JSON.parse(e.data));document.querySelector('#task-form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({destination_x:+x.value,destination_y:+y.value})});if(!r.ok)alert(await r.text())};
</script></body></html>
